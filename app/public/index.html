<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Šolski IS — projekt v izdelavi</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 640px; }
    h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 0 0 12px; }
    p { opacity: 0.92; line-height: 1.55; margin: 8px 0; }
    .team { margin-top: 28px; font-size: 0.95rem; opacity: 0.85; }
    .badge {
      display: inline-block; margin-top: 16px; padding: 6px 14px;
      background: rgba(255,255,255,0.14); border-radius: 999px;
      font-size: 0.85rem; letter-spacing: 0.03em;
    }
    code {
      background: rgba(0,0,0,0.25); padding: 2px 6px; border-radius: 4px;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">v izdelavi</span>
    <h1>Šolski informacijski sistem</h1>
    <p>Projekt zaključnega izpita — spletna aplikacija za podporo šolskemu delu na daljavo.</p>
    <p>Trije pogledi: administrator, učitelj, učenec.</p>
    <div class="team">
      <p>Skupina: <strong>Pajp</strong> · <strong>Nal Dobravc</strong> · <strong>Mitja Jančič</strong></p>
      <p>Status: <code>teden 1 — priprava okolja</code></p>
      <p style="font-size: 0.8rem; opacity: 0.6;">auto-deploy: OK ✓</p>
    </div>
  </main>
</body>
</html>
